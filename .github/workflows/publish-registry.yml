name: Publish to MCP Registry

# Publishes server.json to the Official MCP Registry on every v* tag.
# The registry is in preview and can reset, so we publish on every tag
# rather than once. Namespace app.reassign/reassign is DNS-based (reverse
# of reassign.app), so we authenticate with DNS (ed25519), not GitHub OIDC
# (OIDC only mints io.github.* namespaces).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install mcp-publisher
        env:
          # Pin the version (not `latest`) so a moving/compromised release can't
          # run with the MCP_REGISTRY_DNS_KEY secret in scope. Bump deliberately.
          MCP_PUBLISHER_VERSION: v1.7.9
          # sha256 of mcp-publisher_linux_amd64.tar.gz in that release. Update it with the version.
          MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
          # gh needs a token only to read the public release; the DNS key is not in scope.
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MCP_PUBLISHER_VERSION" \
            --repo modelcontextprotocol/registry \
            --pattern "mcp-publisher_linux_amd64.tar.gz" \
            --output mcp-publisher.tar.gz
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Verify server.json version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./server.json').version")"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match server.json version $ver"
            exit 1
          fi

      - name: Authenticate (DNS)
        env:
          MCP_REGISTRY_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
        run: |
          mcp-publisher login dns \
            --domain reassign.app \
            --private-key "$MCP_REGISTRY_DNS_KEY"

      - name: Publish
        run: mcp-publisher publish --file ./server.json
