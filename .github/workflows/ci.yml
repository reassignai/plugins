name: CI

# Validates the manifests, version lockstep, and npm package on every push and PR,
# so a broken manifest fails here and not in the client that reads it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Validate plugin
        run: bash scripts/build.sh

      - name: Check npm shim
        run: |
          node --check npm/reassign-mcp.js
          npm pack --dry-run
